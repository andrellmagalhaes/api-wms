name: Executando CI/CD do projeto
run-name: ${{ github.actor }} está executando o CI/CD do projeto

on:
  push:
    branches: ["master"]

jobs:
  executar-testes-pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executar testes do Pre-commit
        uses: pre-commit/action@v3.0.1

  executar-testes-pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do projeto
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Executar testes do pytest
        run: |
          python -m pytest
